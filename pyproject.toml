[project]
name = "avis-clients-nlp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "bako", email = "mnimaga@gallium.technology" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
]

[project.scripts]
avis-clients-nlp = "avis_clients_nlp:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
